<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" /> <!-- Q1 Coral Red -->
      <stop offset="50%" stop-color="#6366f1" /> <!-- Primary Accent -->
      <stop offset="100%" stop-color="#0ea5e9" /> <!-- Q2 Ocean Blue -->
    </linearGradient>
    <!-- Subtle drop shadow for the letter Z -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Outer circle with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Centered geometric Z letter -->
  <g filter="url(#shadow)">
    <path d="M156 148h200v48l-132 168h132v48H156v-48l132-168H156z" fill="#ffffff" />
  </g>
</svg>
